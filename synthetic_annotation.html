<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Microscope v0.45 Synthetic Annotation</title><style>body{font:16px system-ui;max-width:620px;margin:auto;padding:18px;line-height:1.4}#frame{position:relative;width:100%;max-width:350px;aspect-ratio:512/910;background:linear-gradient(110deg,#dfdfdf,#bbb);border:2px solid #333;touch-action:manipulation;user-select:none}#ball{position:absolute;border-radius:50%;background:#555;width:16%;aspect-ratio:1;top:46%;left:42%;pointer-events:none}#mark{position:absolute;width:15px;height:15px;border:2px solid red;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none}input{width:90px;padding:9px;margin:4px}button{padding:12px;margin:10px 4px 10px 0}pre{white-space:pre-wrap;word-break:break-word}small{display:block}</style></head><body><h2>v0.45 Synthetic Annotation Gate</h2><p>No real pendulum image is present. Tap the dark circle to test coordinate capture.</p><strong id="js">JAVASCRIPT NOT RUNNING</strong><p id="state">No annotation recorded.</p><div id="frame" role="img" aria-label="Synthetic test frame with dark circle"><div id="ball"></div><div id="mark"></div></div><p>Original frame coordinate system: 512 × 910</p><label>X: <input id="x" type="number" min="0" max="512" step="1"></label><label>Y: <input id="y" type="number" min="0" max="910" step="1"></label><p><label>Reviewer ID: <input id="reviewer" value="TEST" maxlength="32"></label></p><button id="prepare">Prepare JSON</button><button id="download">Download JSON</button><pre id="payload"></pre><script>(()=>{'use strict';const frame=document.querySelector('#frame'),x=document.querySelector('#x'),y=document.querySelector('#y'),state=document.querySelector('#state'),mark=document.querySelector('#mark'),payload=document.querySelector('#payload');document.querySelector('#js').textContent='JAVASCRIPT RUNNING';function setMark(){const a=Number(x.value),b=Number(y.value);if(x.value===''||y.value===''||!Number.isFinite(a)||!Number.isFinite(b)||a<0||a>512||b<0||b>910){mark.style.display='none';return;}mark.style.display='block';mark.style.left=(100*a/512)+'%';mark.style.top=(100*b/910)+'%';}frame.addEventListener('pointerdown',e=>{const r=frame.getBoundingClientRect();x.value=Math.round(Math.max(0,Math.min(512,512*(e.clientX-r.left)/r.width)));y.value=Math.round(Math.max(0,Math.min(910,910*(e.clientY-r.top)/r.height)));setMark();state.textContent='TOUCH RECORDED (synthetic image)';});x.addEventListener('input',setMark);y.addEventListener('input',setMark);function make(){const a=Number(x.value),b=Number(y.value);if(x.value===''||y.value===''||!Number.isFinite(a)||!Number.isFinite(b)||a<0||a>512||b<0||b>910){state.textContent='INVALID COORDINATES';return null;}const record={schema:'motion-microscope-v045-synthetic-browser-test-v1',source:'synthetic-no-research-data',frame_id:'SYNTHETIC-001',width:512,height:910,reviewer_id:document.querySelector('#reviewer').value||'TEST',x:a,y:b,qualification:'DIAGNOSTIC_ONLY'};payload.textContent=JSON.stringify(record,null,2);state.textContent='JSON PREPARED';return record;}document.querySelector('#prepare').addEventListener('click',make);document.querySelector('#download').addEventListener('click',()=>{const record=make();if(!record)return;const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='mm-synthetic-annotation.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);state.textContent='DOWNLOAD TRIGGERED — verify downloaded JSON';});})();</script></body></html>
