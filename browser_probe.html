<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Microscope v0.45 Browser Probe</title><style>body{font:17px system-ui;max-width:640px;margin:auto;padding:24px}#pad{height:180px;border:2px solid #555;background:#eee;display:grid;place-items:center;touch-action:manipulation}button{padding:12px;margin:8px 0}pre{white-space:pre-wrap}</style></head><body><h1>Motion Microscope v0.45 — Browser Probe</h1><p>Public diagnostic only. No video frames or private project files.</p><strong id="js">JAVASCRIPT NOT RUNNING</strong><p id="loc"></p><div id="pad">Tap here</div><pre id="result">Touch not yet detected</pre><button id="export">Test download</button><script>(()=>{'use strict';const out=document.getElementById('result');document.getElementById('js').textContent='JAVASCRIPT RUNNING';document.getElementById('loc').textContent='Protocol: '+location.protocol;document.getElementById('pad').addEventListener('pointerdown',e=>{const r=e.currentTarget.getBoundingClientRect();out.textContent='POINTER RECEIVED: x='+Math.round(e.clientX-r.left)+' y='+Math.round(e.clientY-r.top)+' type='+e.pointerType});document.getElementById('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob(['motion microscope diagnostic'],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='mm-probe.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);out.textContent='DOWNLOAD TRIGGERED — check Files/Downloads';});})();</script></body></html>
